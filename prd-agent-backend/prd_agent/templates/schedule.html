<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Call Request</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .user-info {
        margin: 0 0 20px 0;
        padding: 10px;
        background-color: #f8f8f8;
        border-radius: 5px;
      }
      .message {
        margin: 20px 0;
        padding: 10px;
        background-color: #f8f8f8;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="user-info">
      <h3>User Information:</h3>
      <p><strong>Name:</strong> {{name}}</p>
      <p><strong>Email:</strong> {{email}}</p>
    </div>

    <div class="message">
      <h3>Message from User:</h3>
      <p>{{message}}</p>
    </div>

    <p>
      The user's PRD document is attached to this email. Please review it and
      schedule a call with them at your earliest convenience.
    </p>

    <p>
      You can reach out to them directly at
      <a href="mailto:{{email}}">{{email}}</a> to coordinate the call.
    </p>
  </body>
</html>
