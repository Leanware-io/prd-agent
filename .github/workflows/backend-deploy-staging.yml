name: Backend Deploy Staging

# Staging deploys on every push to main that touches the backend.
#
# NOTE: this replaces a `workflow_run` trigger that never fired — it waited on a
# workflow named "Code Quality" while the CI workflow is actually named
# "Backend CI". `workflow_run` is also deliberately avoided here: it executes in
# the base-repo context with full access to secrets, which is unsafe on a public
# repository.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "prd-agent-backend/**"
      - ".github/workflows/backend-deploy-staging.yml"

jobs:
  build-and-push:
    name: Build and push to GAR
    runs-on: ubuntu-latest
    environment: staging
    env:
      SQLALCHEMY_DATABASE_URI: ${{ secrets.SQLALCHEMY_DATABASE_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      ENVIRONMENT: staging
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      PRD_BUCKET: ${{ vars.PRD_BUCKET }}
      SESSIONS_SECRET_KEY: ${{ secrets.SESSIONS_SECRET_KEY }}
      MODEL: ${{ vars.MODEL }}
      AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
      AI_APP_NAME: ${{ vars.AI_APP_NAME }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      TEAM_EMAIL: ${{ vars.TEAM_EMAIL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env
        working-directory: prd-agent-backend
        run: printenv > .env

      - name: Create firebase credentials
        working-directory: prd-agent-backend
        run: echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > ./firebase-credentials.json

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Login to Google Artifact Registry
        run: |-
          echo '${{ steps.auth.outputs.access_token }}' | docker login -u oauth2accesstoken --password-stdin https://${{ vars.GCP_REGION }}-docker.pkg.dev

      - id: docker-push-tagged
        name: Build, tag, and push image to Google Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: ./prd-agent-backend
          file: ./prd-agent-backend/Dockerfile
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prd-backend/prd:${{ github.run_id }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prd-backend/prd:staging

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: staging
    needs: build-and-push
    steps:
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          tag: staging
          no_traffic: false
          service: prd-staging
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prd-backend/prd:staging
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Output URL
        run: 'echo "Backend deployed, URL is: ${{ steps.deploy.outputs.url }}"'

  deploy-agents:
    name: Deploy agents to Cloud Run
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - id: install-adk
        name: Install Google ADK Python module
        working-directory: prd-agent-backend/agents
        run: |
          pip install -r ./requirements.txt
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
          echo "MODEL=${{ vars.MODEL }}" >> .env

      - id: deploy-using-adk
        name: Deploy to Cloud Run using the ADK CLI
        working-directory: prd-agent-backend
        run: |
          adk deploy cloud_run \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.GCP_REGION }} \
            --service_name=prd-agent-service-staging \
            --with_ui agents/
