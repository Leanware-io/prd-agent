name: Frontend CI

on:
  pull_request:
    paths:
      - "prd-agent-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - release
    paths:
      - "prd-agent-frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: prd-agent-frontend

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: prd-agent-frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint:eslint
        if: always()

      - name: Run Prettier
        run: yarn format:check
        if: always()

      - name: Run CI checks
        run: yarn ci
        if: always()

      - name: Run Jest tests
        run: yarn test
        if: always()
