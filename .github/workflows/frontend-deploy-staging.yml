name: Frontend Deploy Staging

# Staging deploys on every push to main that touches the frontend.
# See the note in backend-deploy-staging.yml for why `workflow_run` is not used.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "prd-agent-frontend/**"
      - ".github/workflows/frontend-deploy-staging.yml"

defaults:
  run:
    working-directory: prd-agent-frontend

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      VITE_NEXT_ENV: ${{ vars.VITE_NEXT_ENV }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_GTAG_ID: ${{ secrets.VITE_GTAG_ID }}
      VITE_GTAG_CONVERSION_ID: ${{ secrets.VITE_GTAG_CONVERSION_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: prd-agent-frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Create .env
        run: printenv > .env

      - name: Build the application
        run: yarn build

      # firebase.json refers to a "staging" hosting target. That target is
      # normally resolved through a committed .firebaserc, which would hardcode
      # the GCP project and site IDs — so it is applied here from repository
      # Variables instead. Requires vars.FIREBASE_HOSTING_SITE_STAGING.
      - name: Apply Firebase hosting target
        run: |
          firebase target:apply hosting staging ${{ vars.FIREBASE_HOSTING_SITE_STAGING }} \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Firebase Hosting
        run: firebase deploy --project ${{ vars.GCP_PROJECT_ID }} --only hosting:staging
